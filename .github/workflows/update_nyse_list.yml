name: Update NYSE List

on:
  schedule:
    - cron: '0 5 * * 0'   # Every Sunday at 5am UTC (before stocks pipeline runs at 6am)
  workflow_dispatch:        # Allows manual trigger from GitHub

permissions:
  contents: write           # Required to push updated JSON files back to the repo

jobs:
  update-nyse-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance

      - name: Run NYSE list enricher
        run: python update_nyse_list.py

      - name: Commit and push updated lists
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add NASDAQ.json NYSE.json AMEX.json name_cache.json
          git diff --staged --quiet || git commit -m "Update exchange lists $(date +'%Y-%m-%d')"
          git push
