name: Update Ticker Lists

on:
  schedule:
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install yfinance requests

      - name: Run Ticker Update
        run: python update_tickers.py

      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add "NYSE.json" "Other list.json"
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update ticker lists $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push
